# ~/.tmux.conf
# A commonly used tmux configuration

# -- General Options --

# Set prefix to Ctrl-a (like screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start windows and panes index at 1, not 0. Easier navigation.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # Renumber windows when one is closed

# Increase scrollback history limit
set -g history-limit 10000

# Set terminal colors (most modern terminals support this)
# Use tmux-256color allows tmux to report its capabilities correctly
set -g default-terminal "tmux-256color"
# Enable true color support (if terminal supports it)
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape time for faster responsiveness (especially with Neovim)
set -s escape-time 0

# Enable mouse support (scrolling, pane selection/resizing)
set -g mouse on

# Automatically set window title based on session, window, index, and current command
set-option -g set-titles on
set-option -g set-titles-string '#S:#I:#W - #{pane_current_command}'

# Enable focus events - needed for some Neovim features like autoread
set -g focus-events on

# Highlight activity in background windows
setw -g monitor-activity on
set -g visual-activity on # Display a message instead of just highlighting status bar


# -- Key Bindings --

# Reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

# Split panes using | for vertical and - for horizontal (retaining current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' # Remove default binding for vertical split
unbind % # Remove default binding for horizontal split

# Switch panes using Prefix + Vim direction keys (h, j, k, l)
# Note: If using vim-tmux-navigator, Ctrl+h/j/k/l might work without prefix already
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing using Prefix + Shift + Vim direction keys (H, J, K, L)
# The -r flag makes resizing repeatable without pressing prefix again quickly
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind > swap-pane -D       # Swap current pane with the next one (Prefix + >)
bind < swap-pane -U       # Swap current pane with the previous one (Prefix + <)

# Cycle through windows
bind n next-window
bind p previous-window

# Kill pane/window without confirmation
bind x kill-pane # Prefix + x
bind & kill-window # Prefix + &

# Copy mode using Vi keys
setw -g mode-keys vi
# Enter copy mode: Prefix + [
# Start selection: v (like Vim visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Start block selection: Ctrl-v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Copy selection and exit copy mode: y
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Copy whole line: Y (Shift-y)
bind-key -T copy-mode-vi Y send-keys -X copy-line
# Paste last copied buffer: Prefix + P
bind P paste-buffer


# -- Status Bar Customization --

# Position status bar at the bottom
set -g status-position bottom

# Center window list
set -g status-justify centre

# Basic colors (adjust as needed)
set -g status-style 'bg=colour235 fg=colour136' # Background: dark grey, Foreground: yellow/orange

# Left side: Session name
set -g status-left-length 40
set -g status-left '#[fg=colour255,bg=colour24,bold] #S #[fg=colour24,bg=colour235,nobold]' # Session name in white on blue bg

# Window status format
# Note: Requires a Powerline-patched font for the separators (, )
# If you don't have one, replace glyphs with simple characters like | or remove them
setw -g window-status-format '#[fg=colour103,bg=colour235] #I:#W ' # Inactive: index:name (light blue on dark grey)
setw -g window-status-current-format '#[fg=colour255,bg=colour27,bold] #I:#W #[fg=colour27,bg=colour235,nobold]' # Active: index:name (white on bright blue bg with separators)
setw -g window-status-separator "" # No separator between window names

# Right side: Date, Time, Hostname
set -g status-right-length 60
# Format: YYYY-MM-DD | HH:MM | hostname (adjust colors/content as desired)
set -g status-right '#[fg=colour109] %Y-%m-%d #[fg=colour136]| %H:%M #[fg=colour255,bg=colour24,bold] #h ' # Date(green) | Time(yellow) | Host(white on blue bg)

# Update status bar every 5 seconds
set -g status-interval 5


