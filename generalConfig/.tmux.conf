# ~/.tmux.conf
# -- General Options --

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# CHANGED: Better compatibility for macOS Terminal/iTerm2
# Using screen-256color for better tmux compatibility
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",screen-256color:RGB"

set -s escape-time 0
set -g mouse on

set-option -g set-titles on
set-option -g set-titles-string '#S:#I:#W - #{pane_current_command}'
set -g focus-events on

setw -g monitor-activity on
set -g visual-activity on

# -- Key Bindings --

bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind > swap-pane -D
bind < swap-pane -U

bind n next-window
bind p previous-window

bind x kill-pane
bind & kill-window

# -- Copy Mode (MAC SPECIFIC) --
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# CHANGED: Use pbcopy for macOS clipboard integration
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind P paste-buffer

# -- Status Bar --
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=colour235 fg=colour136'

set -g status-left-length 40
set -g status-left '#[fg=colour255,bg=colour24,bold] #S #[fg=colour24,bg=colour235,nobold]'

# Ensure you have a Nerd Font installed on Mac (e.g., via brew install font-caskaydia-cove-nerd-font)
setw -g window-status-format '#[fg=colour103,bg=colour235] #I:#W '
setw -g window-status-current-format '#[fg=colour255,bg=colour27,bold] #I:#W #[fg=colour27,bg=colour235,nobold]'
setw -g window-status-separator ""

set -g status-right-length 60
set -g status-right '#[fg=colour109] %Y-%m-%d #[fg=colour136]| %H:%M #[fg=colour255,bg=colour24,bold] #h '
set -g status-interval 5